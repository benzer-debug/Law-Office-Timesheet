<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Tracking - Law Office</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(160deg, #edf1f7 0%, #e2e8f0 45%, #dbe3ee 100%);
      min-height: 100vh;
      color: #2c3e50;
    }

    .navbar {
      background: linear-gradient(90deg, #1a2b4d 0%, #0f1419 100%);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.28);
      border-bottom: 3px solid #d4af37;
      padding: 0.9rem 0;
    }

    .navbar-brand {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: #d4af37 !important;
      font-size: 1.55rem;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }

    .navbar-meta {
      color: #cbd5e1;
      font-size: 0.78rem;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .container {
      max-width: 940px;
    }

    .main-container {
      margin-top: 2.3rem;
      margin-bottom: 2.3rem;
    }

    .card {
      background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
      border: none;
      border-radius: 16px;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.16);
      overflow: hidden;
      border-top: 5px solid #d4af37;
    }

    .card-body {
      padding: 2.8rem;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.95rem;
      font-weight: 700;
      color: #1a2b4d;
      margin-bottom: 1.5rem;
      text-align: center;
      letter-spacing: 0.8px;
    }

    .time-display {
      text-align: center;
      margin-bottom: 2rem;
      padding: 2rem;
      background: linear-gradient(135deg, #1a2b4d 0%, #2a3f5f 100%);
      border-radius: 14px;
      border: 1px solid rgba(212, 175, 55, 0.65);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .current-time {
      font-size: 3.5rem;
      font-weight: 700;
      color: #d4af37;
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
      margin: 0;
    }

    .current-date {
      font-size: 1rem;
      color: #e2e8f0;
      margin-top: 0.8rem;
      font-weight: 500;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .time-btn {
      padding: 1.25rem;
      font-size: 1.02rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      color: white;
      text-transform: none;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      font-family: 'Poppins', sans-serif;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.2);
    }

    .time-btn.is-busy {
      opacity: 0.85;
    }

    .time-btn .btn-spinner {
      font-size: 0.95rem;
    }

    .time-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(15, 23, 42, 0.28);
    }

    .time-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #timeInButton {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }

    #timeOutButton {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }

    .note-section label {
      font-weight: 700;
      color: #1a2b4d;
      margin-bottom: 0.75rem;
      display: block;
      font-size: 1rem;
    }

    .note-section {
      margin-bottom: 1.6rem;
    }

    #note {
      border: 2px solid #d4af37;
      border-radius: 10px;
      padding: 1rem;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    #note:focus {
      border-color: #1a2b4d;
      outline: none;
      box-shadow: 0 0 0 4px rgba(26, 43, 77, 0.1);
    }

    .records-section {
      margin-top: 0.5rem;
      margin-bottom: 2rem;
    }

    .records-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: #1a2b4d;
      margin-bottom: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 2px solid #d4af37;
    }

    .record-item {
      background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
      border-left: 5px solid #d4af37;
      padding: 1.15rem 1.2rem;
      margin-bottom: 0.85rem;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 0.95rem;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    }

    .record-item:hover {
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.12);
      transform: translateY(-1px);
    }

    .record-item.success-flash {
      animation: record-success-pulse 0.75s ease;
    }

    .record-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.2rem;
      border-radius: 25px;
      font-weight: 700;
      font-size: 0.85rem;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-in {
      background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
      color: #065f46;
    }

    .badge-out {
      background: linear-gradient(135deg, #fed7aa 0%, #fdba74 100%);
      color: #92400e;
    }

    .badge-complete {
      background: linear-gradient(135deg, #bfdbfe 0%, #93c5fd 100%);
      color: #0c4a6e;
    }

    .record-time {
      font-size: 1.18rem;
      font-weight: 700;
      color: #1a2b4d;
      font-family: 'Courier New', monospace;
      min-width: 145px;
    }

    .record-note {
      flex: 1;
      color: #6b7280;
      font-size: 0.95rem;
      font-style: italic;
    }

    .empty-message {
      text-align: center;
      padding: 2.5rem;
      color: #6b7280;
      font-size: 1rem;
      font-style: italic;
    }

    .button-footer {
      display: flex;
      gap: 0.8rem;
      margin-top: 1.6rem;
      padding-top: 1.4rem;
      border-top: 2px solid #e5e7eb;
    }

    .btn-footer {
      flex: 1;
      padding: 0.9rem 1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-transform: none;
      font-size: 0.88rem;
      letter-spacing: 0.35px;
      font-family: 'Poppins', sans-serif;
    }

    #backButton {
      background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
      color: white;
    }

    #backButton:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(107, 114, 128, 0.3);
    }

    #logoutButton {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
    }

    #logoutButton:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
    }

    #clearRecordsButton {
      flex: 0.8;
    }

    #clearRecordsButton:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.4);
    }

    .priority-note {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      border-left: 5px solid #f59e0b;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.18);
    }

    .priority-note i {
      color: #d97706;
      font-size: 1.2rem;
    }

    .priority-note-text {
      color: #92400e;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.45px;
    }

    .toast-container-custom {
      position: fixed;
      top: 1.1rem;
      right: 1rem;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-width: 360px;
      width: calc(100% - 2rem);
      pointer-events: none;
    }

    .toast-custom {
      pointer-events: auto;
      border-radius: 10px;
      padding: 0.8rem 0.9rem;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.2);
      color: #0f172a;
      background: #ffffff;
      border-left: 4px solid #1a2b4d;
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      animation: toast-slide-in 0.2s ease;
    }

    .toast-custom.success {
      border-left-color: #059669;
      background: #f0fdf4;
    }

    .toast-custom.error {
      border-left-color: #dc2626;
      background: #fef2f2;
    }

    .toast-custom.info {
      border-left-color: #2563eb;
      background: #eff6ff;
    }

    .toast-custom.warning {
      border-left-color: #d97706;
      background: #fffbeb;
    }

    .toast-custom i {
      margin-top: 0.1rem;
      font-size: 0.95rem;
    }

    .toast-message {
      font-size: 0.88rem;
      line-height: 1.35;
      color: #1e293b;
      font-weight: 600;
    }

    @keyframes toast-slide-in {
      from {
        transform: translateX(14px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes record-success-pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(5, 150, 105, 0.32);
        background: linear-gradient(135deg, #ecfdf5 0%, #f8fafc 100%);
      }
      70% {
        box-shadow: 0 0 0 8px rgba(5, 150, 105, 0);
      }
      100% {
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
        background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .record-item.success-flash {
        animation: none;
      }
    }

    .time-btn:focus-visible,
    .btn-footer:focus-visible,
    #note:focus-visible {
      outline: 3px solid rgba(212, 175, 55, 0.4);
      outline-offset: 2px;
    }

    @media (max-width: 992px) {
      .card-body {
        padding: 2rem;
      }

      .current-time {
        font-size: 3.2rem;
      }

      .navbar-brand {
        font-size: 1.35rem;
        letter-spacing: 1px;
      }

      .navbar-meta {
        display: none;
      }
    }

    @media (max-width: 576px) {
      .card-body {
        padding: 1.5rem;
      }

      .current-time {
        font-size: 2.5rem;
      }

      .card-title {
        font-size: 1.5rem;
      }

      .button-group {
        grid-template-columns: 1fr;
      }

      .button-footer {
        flex-direction: column;
      }

      .record-item {
        flex-wrap: wrap;
        gap: 0.8rem;
      }

      .record-time {
        min-width: 100%;
        font-size: 1.2rem;
      }

      .time-btn,
      .btn-footer {
        width: 100%;
      }
    }

    @media (max-width: 360px) {
      .main-container {
        margin-top: 1.25rem;
        margin-bottom: 1.25rem;
      }

      .card-body {
        padding: 1rem;
      }

      .navbar-brand {
        font-size: 1.05rem;
        letter-spacing: 0.5px;
      }

      .current-time {
        font-size: 2rem;
        letter-spacing: 1px;
      }

      .current-date {
        font-size: 0.9rem;
      }

      .time-display {
        padding: 1.25rem;
      }

      .time-btn {
        padding: 1rem;
        font-size: 0.92rem;
      }

      .record-badge {
        font-size: 0.72rem;
        padding: 0.45rem 0.75rem;
      }

      .record-note {
        font-size: 0.85rem;
      }
    }

    @media (hover: none) and (pointer: coarse) {
      .time-btn,
      .btn-footer,
      button,
      .btn,
      a {
        min-height: 44px;
      }

      #note,
      .form-control,
      input[type="text"],
      input[type="time"],
      input[type="date"],
      input[type="number"],
      select,
      textarea {
        min-height: 44px;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark">
    <div class="container-fluid">
      <span class="navbar-brand"><i class="fas fa-gavel"></i> Time Tracking</span>
      <span class="navbar-meta">Philippine Standard Time</span>
    </div>
  </nav>

  <div class="container main-container">
    <div class="row">
      <div class="col-lg-8 mx-auto">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title"><i class="fas fa-clipboard-check me-2"></i>Record Your Time</h5>

            <div class="time-display">
              <p class="current-time" id="currentTime">--:--</p>
              <p class="current-date" id="currentDate"></p>
            </div>

            <div class="button-group">
              <button id="timeInButton" class="time-btn">
                <i class="fas fa-circle-check"></i> Time In
              </button>
              <button id="timeOutButton" class="time-btn">
                <i class="fas fa-right-from-bracket"></i> Time Out
              </button>
            </div>

            <div class="priority-note">
              <i class="fas fa-exclamation-circle"></i>
              <span class="priority-note-text">Complete both time in and time out today</span>
            </div>

            <div class="note-section">
              <label for="note"><i class="fas fa-sticky-note"></i> Add Note (Optional):</label>
              <input type="text" id="note" class="form-control" maxlength="250" placeholder="e.g., Late start, Early leave, etc...">
            </div>

            <div class="records-section">
              <h6 class="records-title"><i class="fas fa-history me-1"></i>Today's Record</h6>
              <div id="timeRecordsList"></div>
            </div>

            <div class="button-footer">
              <button id="backButton" class="btn-footer"><i class="fas fa-arrow-left me-1"></i>Back to Timesheet</button>
              <button id="logoutButton" class="btn-footer"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
              <button id="clearRecordsButton" class="btn-footer"><i class="fas fa-trash-alt me-1"></i>Clear Records</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container-custom" aria-live="polite" aria-atomic="true"></div>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, addDoc, updateDoc, doc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAmBi8tP4r4zpr3_6y-4Ncek0yk1oLokOs",
  authDomain: "law-office-apps.firebaseapp.com",
  projectId: "law-office-apps",
  storageBucket: "law-office-apps.firebasestorage.app",
  messagingSenderId: "2997240910",
  appId: "1:2997240910:web:d32c1c04f947fe34436f1f",
  measurementId: "G-R3P17HDL3G"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

setPersistence(auth, browserLocalPersistence);

const mainContent = document.querySelector('.main-container');
if (mainContent) mainContent.style.display = 'none';
const loadingDiv = document.createElement('div');
loadingDiv.id = 'auth-loading';
loadingDiv.style = 'text-align:center;padding:3rem;color:#d4af37;font-size:1.2rem;';
loadingDiv.innerHTML = '<div class="spinner-border text-warning" role="status"></div><br>Checking authentication...';
document.body.appendChild(loadingDiv);

onAuthStateChanged(auth, (user) => {
  if (user) {
    if (mainContent) mainContent.style.display = '';
    const loading = document.getElementById('auth-loading');
    if (loading) loading.remove();
    loadTodayLogs();
  } else {
    window.location.href = 'index.html';
  }
});

function getPHDate() {
  const now = new Date();
  const utcTime = now.getTime() + now.getTimezoneOffset() * 60000;
  const phTime = new Date(utcTime + 8 * 60 * 60 * 1000);
  return phTime.toISOString().split('T')[0];
}

function escapeHtml(value) {
  return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
}

function sanitizeNote(note) {
  return String(note || '').trim().slice(0, 250);
}

function showToast(message, type = 'info', duration = 2600) {
  const container = document.getElementById('toastContainer');
  if (!container) return;

  const iconMap = {
    success: 'fa-circle-check',
    error: 'fa-circle-xmark',
    warning: 'fa-triangle-exclamation',
    info: 'fa-circle-info'
  };

  const toast = document.createElement('div');
  toast.className = `toast-custom ${type}`;
  toast.innerHTML = `
    <i class="fas ${iconMap[type] || iconMap.info}"></i>
    <span class="toast-message">${escapeHtml(message)}</span>
  `;

  container.appendChild(toast);
  window.setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(12px)';
    toast.style.transition = 'opacity 0.18s ease, transform 0.18s ease';
    window.setTimeout(() => toast.remove(), 180);
  }, duration);
}

function parseTimeToMinutes(timeValue) {
  if (typeof timeValue !== 'string' || !/^([01]\d|2[0-3]):([0-5]\d)(:[0-5]\d)?$/.test(timeValue)) {
    return null;
  }

  const [hours, minutes] = timeValue.split(':').map(Number);
  return hours * 60 + minutes;
}

function formatToHourMinute(timeValue) {
  if (typeof timeValue !== 'string') {
    return '';
  }

  const match = timeValue.match(/^([01]\d|2[0-3]):([0-5]\d)/);
  if (!match) {
    return timeValue;
  }

  return `${match[1]}:${match[2]}`;
}

function setButtonBusy(button, isBusy, busyLabel = 'Processing...') {
  if (!button) return;

  if (!button.dataset.defaultHtml) {
    button.dataset.defaultHtml = button.innerHTML;
  }

  if (isBusy) {
    button.classList.add('is-busy');
    button.disabled = true;
    button.innerHTML = `<i class="fas fa-spinner fa-spin btn-spinner"></i> ${escapeHtml(busyLabel)}`;
    return;
  }

  button.classList.remove('is-busy');
  button.innerHTML = button.dataset.defaultHtml;
}

function flashLatestRecord() {
  const latestRecord = document.querySelector('#timeRecordsList .record-item');
  if (!latestRecord) return;

  latestRecord.classList.remove('success-flash');
  void latestRecord.offsetWidth;
  latestRecord.classList.add('success-flash');
  window.setTimeout(() => latestRecord.classList.remove('success-flash'), 800);
}

function updateClock() {
  const now = new Date();
  const utcTime = now.getTime() + now.getTimezoneOffset() * 60000;
  const phTime = new Date(utcTime + 8 * 60 * 60 * 1000);
  
  const timeStr = phTime.toLocaleTimeString('en-US', {
    hour: '2-digit', minute: '2-digit', hour12: false
  });
  const dateStr = phTime.toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });
  document.getElementById('currentTime').textContent = timeStr;
  document.getElementById('currentDate').textContent = dateStr;
}

updateClock();
setInterval(updateClock, 1000);

async function checkAndUpdateButtonStates() {
  const user = auth.currentUser;
  if (!user) return;
  const dateStr = getPHDate();
  const logsRef = collection(db, 'daily_logs');
  const q = query(logsRef, where('uid', '==', user.uid), where('date', '==', dateStr));
  const snap = await getDocs(q);
  const timeInBtn = document.getElementById('timeInButton');
  const timeOutBtn = document.getElementById('timeOutButton');
  
  if (snap.empty) {
    timeInBtn.disabled = false;
    timeOutBtn.disabled = true;
  } else {
    const openRecord = snap.docs.find((docSnap) => {
      const entry = docSnap.data();
      return entry.timeIn && !entry.timeOut;
    });
    const record = openRecord ? openRecord.data() : snap.docs[0].data();

    if (record.timeIn && !record.timeOut) {
      timeInBtn.disabled = true;
      timeOutBtn.disabled = false;
    } else if (record.timeIn && record.timeOut) {
      timeInBtn.disabled = true;
      timeOutBtn.disabled = true;
    } else {
      timeInBtn.disabled = false;
      timeOutBtn.disabled = true;
    }
  }
}

async function loadTodayLogs() {
  const user = auth.currentUser;
  if (!user) return;
  const dateStr = getPHDate();
  const logsRef = collection(db, 'daily_logs');
  const q = query(logsRef, where('uid', '==', user.uid), where('date', '==', dateStr));
  const snap = await getDocs(q);
  const records = [];
  snap.forEach(docSnap => records.push({ id: docSnap.id, ...docSnap.data() }));
  
  const listDiv = document.getElementById('timeRecordsList');
  listDiv.innerHTML = '';
  
  if (records.length === 0) {
    listDiv.innerHTML = '<div class="empty-message">No records for today yet. Click Time In to get started!</div>';
  } else {
    const record = records.find((entry) => entry.timeIn && !entry.timeOut) || records[0];
    const badgeClass = record.timeOut ? 'badge-complete' : 'badge-in';
    const badgeText = record.timeOut ? '✅ COMPLETED' : '🟢 IN PROGRESS';
    const timeInDisplay = formatToHourMinute(record.timeIn);
    const timeOutDisplay = formatToHourMinute(record.timeOut);
    const safeNote = sanitizeNote(record.note);
    const noteHtml = safeNote ? `<span class="record-note">${escapeHtml(safeNote)}</span>` : '';
    
    const div = document.createElement('div');
    div.className = 'record-item';
    div.innerHTML = `
      <span class="record-badge ${badgeClass}">${badgeText}</span>
      <span class="record-time">${timeInDisplay}${timeOutDisplay ? ' → ' + timeOutDisplay : ' (Waiting for Time Out)'}</span>
      ${noteHtml}
    `;
    listDiv.appendChild(div);
  }
  
  await checkAndUpdateButtonStates();
}

async function saveMonthlyRecord() {
  const user = auth.currentUser;
  if (!user) return;

  try {
    const logsRef = collection(db, 'daily_logs');
    const snapshot = await getDocs(query(logsRef, where('uid', '==', user.uid)));
    const monthlyBuckets = new Map();

    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      if (typeof data.date !== 'string' || !data.timeIn || !data.timeOut) return;

      const inMinutes = parseTimeToMinutes(data.timeIn);
      const outMinutes = parseTimeToMinutes(data.timeOut);
      if (inMinutes === null || outMinutes === null || outMinutes <= inMinutes) {
        return;
      }

      const year = Number(data.date.slice(0, 4));
      const month = data.date.slice(5, 7);
      const monthKey = `${year}-${month}`;
      const durationHours = (outMinutes - inMinutes) / 60;
      const netHours = Math.max(0, durationHours > 5 ? durationHours - 1 : durationHours);

      if (!monthlyBuckets.has(monthKey)) {
        monthlyBuckets.set(monthKey, {
          year,
          month,
          totalHours: 0,
          daysWorked: 0
        });
      }

      const bucket = monthlyBuckets.get(monthKey);
      bucket.totalHours += netHours;
      bucket.daysWorked += 1;
    });

    await Promise.all(Array.from(monthlyBuckets.entries()).map(([monthKey, bucket]) => {
      const monthlyDocId = `${user.uid}_${monthKey}`;
      return setDoc(doc(db, 'monthly_records', monthlyDocId), {
        uid: user.uid,
        userId: user.uid,
        month: bucket.month,
        year: bucket.year,
        monthKey,
        totalHours: parseFloat(bucket.totalHours.toFixed(2)),
        totalSalary: 0,
        daysWorked: bucket.daysWorked,
        updatedAt: new Date(),
        lastAutoSave: new Date()
      }, { merge: true });
    }));

    console.log(`✅ Monthly records synced: ${monthlyBuckets.size} month(s)`);
  } catch (e) {
    console.error('Error saving monthly record:', e);
  }
}

function getDateRangeWeekdays(startDate, endDate) {
  const dates = [];
  const cursor = new Date(`${startDate}T00:00:00Z`);
  const lastDate = new Date(`${endDate}T00:00:00Z`);

  while (cursor <= lastDate) {
    const weekday = cursor.getUTCDay();
    if (weekday >= 1 && weekday <= 5) {
      dates.push(cursor.toISOString().split('T')[0]);
    }
    cursor.setUTCDate(cursor.getUTCDate() + 1);
  }

  return dates;
}

async function backfillWeekdayLogs(options = {}) {
  const user = auth.currentUser;
  if (!user) {
    showToast('User not authenticated', 'error');
    return { created: 0, skipped: 0, totalWeekdays: 0 };
  }

  const currentYear = String(new Date().getFullYear());
  const startDate = options.startDate || `${currentYear}-01-01`;
  const endDate = options.endDate || `${currentYear}-03-15`;
  const timeIn = options.timeIn || '08:00';
  const timeOut = options.timeOut || '17:00';
  const note = sanitizeNote(options.note || '');

  if (parseTimeToMinutes(timeIn) === null || parseTimeToMinutes(timeOut) === null) {
    throw new Error('Invalid time format. Use HH:MM (24-hour), e.g. 08:00 and 17:00.');
  }

  const logsRef = collection(db, 'daily_logs');
  let snapshot;

  try {
    const rangeQuery = query(
      logsRef,
      where('uid', '==', user.uid),
      where('date', '>=', startDate),
      where('date', '<=', endDate)
    );
    snapshot = await getDocs(rangeQuery);
  } catch (queryError) {
    const fallbackQuery = query(logsRef, where('uid', '==', user.uid));
    snapshot = await getDocs(fallbackQuery);
  }

  const existingDates = new Set();
  snapshot.forEach((docSnap) => {
    const data = docSnap.data();
    if (data.uid === user.uid && data.date >= startDate && data.date <= endDate) {
      existingDates.add(data.date);
    }
  });

  const targetDates = getDateRangeWeekdays(startDate, endDate);
  let created = 0;
  let skipped = 0;

  for (const dateStr of targetDates) {
    if (existingDates.has(dateStr)) {
      skipped++;
      continue;
    }

    await addDoc(logsRef, {
      uid: user.uid,
      userId: user.uid,
      date: dateStr,
      timeIn,
      timeOut,
      note,
      createdAt: new Date(),
      updatedAt: new Date()
    });
    created++;
  }

  await loadTodayLogs();
  showToast(`Backfill complete: ${created} created, ${skipped} skipped.`, 'success', 4200);
  return { created, skipped, totalWeekdays: targetDates.length };
}

window.backfillWeekdayLogs = backfillWeekdayLogs;

document.getElementById('backButton').addEventListener('click', () => {
  window.location.href = 'index.html';
});

document.getElementById('logoutButton').addEventListener('click', async () => {
  try {
    await signOut(auth);
    window.location.href = 'index.html';
  } catch (e) {
    showToast('Error logging out: ' + e.message, 'error', 3200);

});

document.getElementById('clearRecordsButton').addEventListener('click', async () => {
  if (!confirm('Are you sure you want to delete ALL daily logs? This cannot be undone.')) {
    return;
  }
  try {
    const user = auth.currentUser;
    if (!user) {
      showToast('User not authenticated', 'error');
      return;
    }
    const logsRef = collection(db, 'daily_logs');
    const q = query(logsRef, where('uid', '==', user.uid));
    const snap = await getDocs(q);
    
    let deletedCount = 0;
    for (const docSnap of snap.docs) {
      await deleteDoc(doc(db, 'daily_logs', docSnap.id));
      deletedCount++;
    }
    
    showToast(`Deleted ${deletedCount} record(s)`, 'success');
    await loadTodayLogs();
  } catch (e) {
    showToast('Error deleting records: ' + e.message, 'error', 3200);
  }
});

document.getElementById('timeInButton').addEventListener('click', async () => {
  const btn = document.getElementById('timeInButton');
  setButtonBusy(btn, true, 'Recording Time In...');
  try {
    const user = auth.currentUser;
    if (!user) {
      showToast('User not authenticated', 'error');
      setButtonBusy(btn, false);
      btn.disabled = false;
      return;
    }
    const now = new Date();
    const utcTime = now.getTime() + now.getTimezoneOffset() * 60000;
    const phTime = new Date(utcTime + 8 * 60 * 60 * 1000);
    const timeStr = phTime.toLocaleTimeString('en-US', {
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });
    const dateStr = getPHDate();
    const note = sanitizeNote(document.getElementById('note').value);

    if (parseTimeToMinutes(timeStr) === null) {
      throw new Error('Generated time format is invalid. Please try again.');
    }

    await addDoc(collection(db, 'daily_logs'), {
      uid: user.uid,
      userId: user.uid,
      date: dateStr,
      timeIn: timeStr,
      timeOut: null,
      note: note || '',
      createdAt: new Date()
    });
    document.getElementById('note').value = '';
    await loadTodayLogs();
    flashLatestRecord();
    setButtonBusy(btn, false);
    showToast('Time in recorded at ' + timeStr.substring(0, 5), 'success');
  } catch (e) {
    showToast('Error recording time in: ' + e.message, 'error', 3200);
    setButtonBusy(btn, false);
    btn.disabled = false;
  }
});

document.getElementById('timeOutButton').addEventListener('click', async () => {
  const btn = document.getElementById('timeOutButton');
  setButtonBusy(btn, true, 'Recording Time Out...');
  try {
    const user = auth.currentUser;
    if (!user) {
      showToast('User not authenticated', 'error');
      setButtonBusy(btn, false);
      btn.disabled = false;
      return;
    }
    const now = new Date();
    const utcTime = now.getTime() + now.getTimezoneOffset() * 60000;
    const phTime = new Date(utcTime + 8 * 60 * 60 * 1000);
    const timeStr = phTime.toLocaleTimeString('en-US', {
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });
    const dateStr = getPHDate();
    const logsRef = collection(db, 'daily_logs');
    const q = query(logsRef, where('uid', '==', user.uid), where('date', '==', dateStr));
    const snap = await getDocs(q);
    if (snap.empty) {
      showToast('No time in record found for today. Please time in first.', 'warning', 3200);
      setButtonBusy(btn, false);
      btn.disabled = false;
      return;
    }

    const openLog = snap.docs.find((docSnap) => {
      const data = docSnap.data();
      return data.timeIn && !data.timeOut;
    });

    if (!openLog) {
      showToast('No active time in record found for today.', 'warning', 3200);
      setButtonBusy(btn, false);
      btn.disabled = false;
      return;
    }

    if (parseTimeToMinutes(timeStr) === null) {
      throw new Error('Generated time format is invalid. Please try again.');
    }

    const docId = openLog.id;
    const logDoc = doc(db, 'daily_logs', docId);
    await updateDoc(logDoc, { timeOut: timeStr });
    await loadTodayLogs();
    await saveMonthlyRecord(); // Auto-save monthly record
    flashLatestRecord();
    setButtonBusy(btn, false);
    showToast('Time out recorded at ' + timeStr.substring(0, 5), 'success');
  } catch (e) {
    showToast('Error recording time out: ' + e.message, 'error', 3200);
    setButtonBusy(btn, false);
    btn.disabled = false;
  }
});
