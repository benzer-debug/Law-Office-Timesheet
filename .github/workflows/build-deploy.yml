# GitHub Actions Workflow - Build & Deploy

name: Build and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint --if-present
    
    - name: Run tests
      run: npm test --if-present
    
    - name: Run security audit (production only)
      run: npm audit --production --audit-level=high --if-present


  # Note: Deployment is handled by Vercel integration with GitHub
  # Vercel automatically deploys when code is pushed to main branch
  # See vercel.json for build configuration
