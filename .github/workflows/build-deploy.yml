# GitHub Actions Workflow - Build & Deploy

name: Build and Deploy

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QA_ENFORCE: 'false'
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup Java for Firestore Emulator
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint --if-present
    
    - name: Run tests
      run: npm test --if-present

    - name: Run Firestore rules tests
      id: rules_tests
      continue-on-error: ${{ env.QA_ENFORCE != 'true' }}
      run: npm run test:rules --if-present

    - name: Warn on rules test failure (staged mode)
      if: ${{ steps.rules_tests.outcome == 'failure' && env.QA_ENFORCE != 'true' }}
      run: |
        echo "::warning::Firestore rules tests failed, but QA_ENFORCE=false so workflow continues."
        echo "Set QA_ENFORCE='true' in this workflow to make this blocking."

    - name: Fail on rules test failure (strict mode)
      if: ${{ steps.rules_tests.outcome == 'failure' && env.QA_ENFORCE == 'true' }}
      run: |
        echo "::error::Firestore rules tests failed and QA_ENFORCE=true."
        exit 1
    
    - name: Run security audit (production only)
      run: npm audit --omit=dev --audit-level=high --if-present


  # Note: Deployment is handled by Vercel integration with GitHub
  # Vercel automatically deploys when code is pushed to main branch
  # See vercel.json for build configuration
