# GitHub Actions Workflow - Strict QA (Main)

name: Strict QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  strict-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup Java for Firestore Emulator
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint --if-present

    - name: Run tests
      run: npm test --if-present

    - name: Run Firestore rules tests (strict)
      run: npm run test:rules --if-present

    - name: Run security audit (production only)
      run: npm audit --omit=dev --audit-level=high --if-present
